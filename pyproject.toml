[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metrics-claim-audit"
version = "0.1.0"
description = "Static audit of documentation claims against Prometheus-format wiring"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
metrics-claim-audit = "metrics_claim_audit.cli:main"

[tool.setuptools.packages.find]
include = ["metrics_claim_audit*"]
